; mR3 OS
; Pins come from the schematic (mp3.kicad_sch), see include/Config.h.
;
;   pio run -e mr3          player firmware (src/, without src/hwtest/)
;   pio run -e hwtest       hardware diagnostics (src/hwtest/ only)

[platformio]
default_envs = mr3

[common]
; pinned platform = Arduino-ESP32 3.3.7 (this exact URL built the hardware test successfully)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ---- module-specific settings: CHECK THESE AGAINST YOUR ESP32-S3-WROOM-1 ----
; PSRAM (ESP32-audioI2S needs it):
;   N8R8 / N16R8 (octal PSRAM) -> qio_opi
;   N8R2 / N4R2  (quad PSRAM)  -> qio_qspi
board_build.arduino.memory_type = qio_opi
; Flash size: the board definition assumes 8 MB. Change for other modules, e.g.
;   N16R8 -> board_upload.flash_size = 16MB (and board_build.partitions = default_16MB.csv)
;   N4R2  -> board_upload.flash_size = 4MB  (and board_build.partitions = default.csv)
; board_upload.flash_size = 8MB

build_flags =
    ; USB goes straight to the S3 (no UART bridge) -> Serial over native USB
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    ; TFT_eSPI configured here instead of editing User_Setup.h
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=41
    -DTFT_SCLK=42
    -DTFT_CS=38
    -DTFT_DC=39
    -DTFT_RST=40
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    ; ---- ESP32-audioI2S 4.0.1 on Arduino-ESP32 3.3.7 (verified against both core sources) ----
    ; The library expects CORE_DEBUG_LEVEL to be defined; this core does not define it.
    ; 2 = errors + warnings, which the audio task forwards to Serial.
    -DCORE_DEBUG_LEVEL=2
    ; The library calls NetworkClientSecure::useBuiltinCACertBundle(), which exists in core 3.3.12
    ; but not in 3.3.7. On core 3.x the library never executes that call (it takes the
    ; setInsecure() branch instead), so mapping it to setInsecure() keeps behaviour identical.
    ; REMOVE THIS LINE when you move to a platform with core >= 3.3.12 (it would clash with
    ; the core's own declaration of useBuiltinCACertBundle).
    -DuseBuiltinCACertBundle=setInsecure

; ---- the player firmware ----
[env:mr3]
extends = common
; hwtest.cpp may sit in src/ or in src/hwtest/ - both layouts are excluded here
build_src_filter = +<*> -<hwtest/> -<hwtest.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; pinned to the commit whose API was checked (v4.0.1, needs PSRAM)
    https://github.com/schreibfaul1/ESP32-audioI2S.git#1fb6edf72420387750a7b38e3ecced980cc390b8

; ---- hardware diagnostics: display, backlight, PSRAM, I2C, SD, buttons, DAC ----
[env:hwtest]
extends = common
build_src_filter = -<*> +<hwtest/> +<hwtest.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43